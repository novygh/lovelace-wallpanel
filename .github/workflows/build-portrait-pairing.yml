name: Build portrait pairing fork

on:
  push:
    branches:
      - feature/portrait-pairing

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --check portrait-pairing.js
      - run: node --check portrait-info-fix.js
      - run: npx rollup -c --input wallpanel-fork-src.js --file wallpanel.js
      - uses: actions/upload-artifact@v4
        with:
          name: wallpanel-portrait-pairing
          path: wallpanel.js
